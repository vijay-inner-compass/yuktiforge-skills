schema_version: '1.0'
skill_id: architecture-documenter
version: 0.1.2
description: 'Documents a system''s architecture from its code: system, solution and technology architecture,
  a high-level design and a low-level design, with C4 context, container, component, integration and data-flow
  diagrams drawn from the same evidence and checked against it. Use when the user asks for architecture
  documentation, an HLD/LLD or diagrams of an existing codebase. Diagrams that the evidence cannot support
  are reported as not generated, with the reason.'
inputs:
- kind: repository
  languages: []
  description: ''
outputs:
- kind: system-architecture
  format: markdown
- kind: solution-architecture
  format: markdown
- kind: technology-architecture
  format: markdown
- kind: hld
  format: markdown
- kind: lld
  format: markdown
- kind: diagram-set
  format: svg
analyzers: []
permissions:
  network: false
  secrets: []
  commands:
  - python3
  - dot
  - pandoc
  - node
  - git
  filesystem_write:
  - docs
dependencies:
- name: pydantic
  version_spec: ==2.14.0
  reason: model validation
- name: pyyaml
  version_spec: ==6.0.3
  reason: reading YAML files
targets:
- claude-code
- github-copilot
- codex
- antigravity
assumptions: []
workflow: []
examples: []
requirement: ''
