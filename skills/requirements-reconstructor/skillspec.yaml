schema_version: '1.0'
skill_id: requirements-reconstructor
version: 0.1.1
description: 'Drafts a business requirements document and a software requirements specification from existing
  code, as clearly marked reconstructions: candidate requirements with evidence, explicit gaps where business
  intent is unknowable from code, and a traceability record that links requirements to code only when
  a named person says so. Use when the user needs requirements for a system that has none. Never presents
  a reconstruction as approved.'
inputs:
- kind: repository
  languages: []
  description: ''
outputs:
- kind: brd-draft
  format: markdown
- kind: srs-draft
  format: markdown
- kind: business-rule-catalog
  format: markdown
- kind: traceability
  format: json
analyzers: []
permissions:
  network: false
  secrets: []
  commands:
  - python3
  filesystem_write:
  - docs
dependencies:
- name: pydantic
  version_spec: ==2.14.0
  reason: model validation
- name: pyyaml
  version_spec: ==6.0.3
  reason: reading YAML files
targets:
- claude-code
- github-copilot
- codex
- antigravity
assumptions: []
workflow: []
examples: []
requirement: ''
