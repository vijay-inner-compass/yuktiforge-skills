schema_version: '1.0'
skill_id: api-integration-documenter
version: 0.1.2
description: 'Documents a system''s interfaces: HTTP routes, outbound calls to external services, message
  topics, OpenAPI contracts reconciled with code, and data flows between them, with an integration diagram
  and data-flow diagrams. Use when the user asks for an API catalog, what a service calls or exposes,
  or integration documentation. Contract-versus-code differences are reported, not resolved.'
inputs:
- kind: repository
  languages: []
  description: ''
outputs:
- kind: api-catalog
  format: markdown
- kind: dataflow
  format: markdown
- kind: integration-diagram
  format: svg
- kind: dfd
  format: svg
analyzers: []
permissions:
  network: false
  secrets: []
  commands:
  - python3
  - dot
  - pandoc
  - node
  - git
  filesystem_write:
  - docs
dependencies:
- name: pydantic
  version_spec: ==2.14.0
  reason: model validation
- name: pyyaml
  version_spec: ==6.0.3
  reason: reading YAML files
targets:
- claude-code
- github-copilot
- codex
- antigravity
assumptions: []
workflow: []
examples: []
requirement: ''
