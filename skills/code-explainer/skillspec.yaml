schema_version: '1.0'
skill_id: code-explainer
version: 0.1.2
description: Explains what a module, symbol or whole repository declares and how its parts relate, as
  an evidence-backed document with file and line citations, written for a chosen audience (developer,
  architect, BA, QA, support, onboarding, executive). Use when the user asks what some code does, how
  a module or class is structured, or wants onboarding material. Reads source without running it; states
  what it cannot know.
inputs:
- kind: repository
  languages: []
  description: ''
outputs:
- kind: code-explanation
  format: markdown
- kind: knowledge-model
  format: json
analyzers: []
permissions:
  network: false
  secrets: []
  commands:
  - python3
  filesystem_write:
  - docs
dependencies:
- name: pydantic
  version_spec: ==2.14.0
  reason: model validation
- name: pyyaml
  version_spec: ==6.0.3
  reason: reading YAML files
targets:
- claude-code
- github-copilot
- codex
- antigravity
assumptions: []
workflow: []
examples: []
requirement: ''
